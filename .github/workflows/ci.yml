name: CI checks

on:
  pull_request:
    branches:
      - develop
      - UAT
      - release
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Fix Jest permission issues
        run: chmod +x ./node_modules/.bin/jest

      - name: Run all tests suites # Not extremely good but necessary on open source project
        run: npm run test # Asumiendo un script de build en tu package.json

      - name: Check code coverage
        run: |
          COVERAGE=$(npx nyc report --reporter=text-summary | grep "Statements" | awk '{print $NF}' | cut -d'%' -f1)
          echo "Cobertura actual: $COVERAGE%"
          if (( $(echo "$COVERAGE < 75" | bc -l) )); then
            echo "La cobertura de código (${COVERAGE}%) está por debajo del 75% requerido."
            exit 1
          fi